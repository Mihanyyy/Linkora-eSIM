<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Linkora eSIM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://linkora-esim-api-jakj.vercel.app" crossorigin>
<link rel="dns-prefetch" href="https://linkora-esim-api-jakj.vercel.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050d07;
  --forest: #0a1a0c;
  --moss: #1a3320;
  --emerald: #2d6a4f;
  --leaf: #52b788;
  --glow: #74c69d;
  --mist: #b7e4c7;
  --white: #e8f5e9;
  --gray: #6b9e7a;
  --card: rgba(10,26,12,0.7);
  --border: rgba(82,183,136,0.14);
  --serif: 'Cormorant Garamond', serif;
  --sans: 'Inter', sans-serif;
  --ease: cubic-bezier(0.22,1,0.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
  position: fixed;
  inset: 0;
}

#canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }

.app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.header {
  flex-shrink: 0;
  padding: 14px 20px 12px;
  background: rgba(5,13,7,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: relative; z-index: 10;
}
.header-logo {
  font-family: var(--serif);
  font-size: 20px; font-weight: 300;
  color: var(--glow);
  letter-spacing: 3px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.logo-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--leaf);
  box-shadow: 0 0 6px var(--leaf);
  animation: pulse 3s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-btn {
  background: rgba(82,183,136,0.08);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--gray);
  padding: 7px 10px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s;
}
.header-btn:active { background: rgba(82,183,136,0.15); }

/* Language switcher */
.lang-switcher { position: relative; }
.lang-btn {
  background: rgba(82,183,136,0.08);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--gray);
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: var(--sans);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.lang-btn:active { background: rgba(82,183,136,0.15); }
.lang-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: rgba(5,13,7,0.98);
  border: 1px solid rgba(82,183,136,0.2);
  border-radius: 12px;
  padding: 4px;
  min-width: 120px;
  z-index: 1000;
  backdrop-filter: blur(20px);
  box-shadow: 0 16px 32px rgba(0,0,0,0.6);
}
.lang-menu.open { display: block; }
.lang-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--gray);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-item:hover { background: rgba(82,183,136,0.1); color: var(--mist); }
.lang-item.active { color: var(--glow); background: rgba(82,183,136,0.08); }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.scroll-area::-webkit-scrollbar { display: none; }

.hero-banner {
  padding: 28px 20px 24px;
  background: linear-gradient(180deg, rgba(45,106,79,0.15) 0%, rgba(10,26,12,0.4) 100%);
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.hero-banner::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(116,198,157,0.4), transparent);
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  background: rgba(82,183,136,0.1);
  border: 1px solid rgba(82,183,136,0.2);
  border-radius: 100px;
  font-size: 11px; color: var(--glow);
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 14px;
  line-height: 1;
  vertical-align: middle;
}
.hero-badge-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--leaf);
  box-shadow: 0 0 6px var(--leaf);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
.hero-title { font-family: var(--serif); font-size: 32px; font-weight: 300; line-height: 1.05; margin-bottom: 10px; }
.hero-title em { font-style: italic; color: var(--glow); }
.hero-sub { font-size: 13px; color: var(--gray); margin-bottom: 18px; font-weight: 300; }
.hero-stats { display: flex; gap: 0; background: rgba(10,26,12,0.5); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.h-stat { flex: 1; text-align: center; padding: 12px 8px; border-right: 1px solid var(--border); }
.h-stat:last-child { border-right: none; }
.h-stat-val { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--glow); line-height: 1; }
.h-stat-lbl { font-size: 9px; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }

.tabs-wrap { padding: 14px 20px 0; background: rgba(5,13,7,0.6); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 7px 16px; background: rgba(10,26,12,0.8); border: 1px solid var(--border); border-radius: 100px; font-size: 12px; color: var(--gray); cursor: pointer; white-space: nowrap; transition: all 0.3s var(--ease); font-weight: 400; letter-spacing: 0.3px; }
.tab.active { background: rgba(45,106,79,0.3); border-color: rgba(82,183,136,0.5); color: var(--glow); }
.tab:active { transform: scale(0.95); }

.section-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; }
.section-title { font-size: 11px; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
.section-count { font-size: 12px; color: var(--leaf); }

.packages { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.pkg-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(8px); transition: all 0.3s var(--ease); position: relative; overflow: hidden; }
.pkg-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--leaf), transparent); opacity: 0; transition: opacity 0.3s; }
.pkg-card:active { transform: scale(0.98); background: rgba(26,51,32,0.6); border-color: rgba(82,183,136,0.3); }
.pkg-card.featured { border-color: rgba(82,183,136,0.3); background: linear-gradient(135deg, rgba(26,51,32,0.7) 0%, rgba(10,26,12,0.8) 100%); }
.pkg-card.featured::after { opacity: 1; }
.pkg-left { display: flex; align-items: center; gap: 14px; }
.pkg-flag { font-size: 28px; line-height: 1; width: 36px; text-align: center; }
.pkg-featured-badge { display: inline-block; font-size: 9px; padding: 2px 8px; background: rgba(82,183,136,0.15); border: 1px solid rgba(82,183,136,0.3); border-radius: 100px; color: var(--glow); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
.pkg-name { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 3px; }
.pkg-meta { font-size: 12px; color: var(--gray); }
.pkg-right { text-align: right; flex-shrink: 0; }
.pkg-price { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--glow); line-height: 1; }
.pkg-per { font-size: 10px; color: var(--gray); margin-top: 3px; }

.empty { text-align: center; padding: 48px 20px; color: var(--gray); }
.empty-icon { font-size: 36px; margin-bottom: 14px; opacity: 0.5; }
.empty p { font-size: 14px; font-weight: 300; }

.bottom-nav { flex-shrink: 0; background: rgba(5,13,7,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 18px)); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: rgba(107,158,122,0.5); font-size: 10px; letter-spacing: 0.5px; cursor: pointer; padding: 4px 0; transition: color 0.3s; font-family: var(--sans); text-transform: uppercase; }
.nav-item.active { color: var(--glow); }
.nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.page { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page.active { display: flex; flex-direction: column; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal { background: linear-gradient(180deg, #0d1f10 0%, #050d07 100%); border: 1px solid var(--border); border-bottom: none; border-radius: 24px 24px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 24px); }
.modal-handle { width: 36px; height: 3px; background: rgba(82,183,136,0.3); border-radius: 2px; margin: 14px auto 0; }
.modal-close-row { display: flex; justify-content: flex-end; padding: 8px 16px 0; }
.modal-close { background: rgba(82,183,136,0.08); border: 1px solid var(--border); border-radius: 8px; color: var(--gray); cursor: pointer; padding: 6px 12px; font-size: 13px; font-family: var(--sans); }
.modal-hero { padding: 8px 24px 20px; text-align: center; border-bottom: 1px solid var(--border); }
.modal-flag { font-size: 52px; margin-bottom: 10px; }
.modal-name { font-family: var(--serif); font-size: 26px; font-weight: 300; color: var(--mist); margin-bottom: 4px; }
.modal-region { font-size: 13px; color: var(--gray); }
.modal-body { padding: 20px 24px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.detail-card { background: rgba(26,51,32,0.4); border: 1px solid rgba(82,183,136,0.12); border-radius: 12px; padding: 14px; }
.detail-card-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
.detail-card-val { font-family: var(--serif); font-size: 20px; font-weight: 300; color: var(--glow); }
.detail-rows { margin-bottom: 24px; }
.detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(82,183,136,0.07); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-row-label { color: var(--gray); font-weight: 300; }
.detail-row-val { color: var(--white); font-weight: 400; }
.price-big { font-family: var(--serif); font-size: 44px; font-weight: 300; color: var(--glow); margin-bottom: 4px; }
.price-per { font-size: 13px; color: var(--gray); margin-bottom: 20px; }
.buy-btn { display: block; width: 100%; padding: 16px; background: linear-gradient(135deg, var(--emerald), var(--leaf)); color: var(--white); border: none; border-radius: 14px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; font-family: var(--sans); box-shadow: 0 4px 20px rgba(82,183,136,0.3); transition: all 0.3s var(--ease); }
.buy-btn:active { transform: scale(0.98); opacity: 0.9; }
.pay-methods { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pay-chip { font-size: 11px; padding: 4px 12px; background: rgba(82,183,136,0.08); border: 1px solid rgba(82,183,136,0.2); border-radius: 100px; color: var(--glow); letter-spacing: 0.5px; }
.pay-btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 10px; font-family: var(--sans); transition: all 0.3s; }
.pay-btn-stars { background: linear-gradient(135deg, #1a4a2e, #2d6a4f); color: var(--white); border: 1px solid rgba(82,183,136,0.3); box-shadow: 0 4px 16px rgba(82,183,136,0.2); }
.stars-note { font-size: 11px; opacity: 0.55; text-align: center; margin: -6px 0 10px; line-height: 1.4; }
.pay-btn-crypto { background: rgba(26,51,32,0.5); color: var(--glow); border: 1px solid rgba(82,183,136,0.2); }
.pay-btn:active { transform: scale(0.98); }

.orders-wrap { padding: 20px 16px; }
.order-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; backdrop-filter: blur(8px); }
.order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.order-name { font-size: 14px; font-weight: 500; }
.order-status { font-size: 10px; padding: 3px 10px; border-radius: 100px; letter-spacing: 0.5px; }
.status-delivered { background: rgba(82,183,136,0.15); color: var(--glow); border: 1px solid rgba(82,183,136,0.3); }
.status-pending { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
.order-meta { font-size: 12px; color: var(--gray); }

.support-wrap { padding: 20px 16px; }
.support-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 12px; text-align: center; backdrop-filter: blur(8px); }
.support-icon { font-size: 36px; margin-bottom: 12px; }
.support-title { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--mist); margin-bottom: 8px; }
.support-text { font-size: 13px; color: var(--gray); line-height: 1.7; font-weight: 300; }
.support-btn { display: block; width: 100%; margin-top: 16px; padding: 14px; background: linear-gradient(135deg, var(--emerald), var(--leaf)); color: var(--white); border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--sans); box-shadow: 0 4px 16px rgba(82,183,136,0.25); }

/* ── v2: поиск, плитки регионов, списки стран, тарифы ───────────────── */
.icon-btn { display: flex; align-items: center; justify-content: center; padding: 7px 9px; }
.icon-btn svg, .lang-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lang-menu { min-width: 140px; }
.lang-item { font-size: 13px; }

.hero-banner.compact { display: none; }

.search-wrap { position: sticky; top: 0; z-index: 5; padding: 12px 16px 10px; background: rgba(5,13,7,0.92); backdrop-filter: blur(16px); }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--leaf); fill: none; stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
.search-input { width: 100%; background: rgba(10,26,12,0.85); border: 1px solid var(--border); border-radius: 12px; padding: 11px 40px 11px 40px; color: var(--white); font-size: 15px; outline: none; font-family: var(--sans); transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
.search-input::placeholder { color: rgba(107,158,122,0.75); }
.search-input:focus { border-color: rgba(82,183,136,0.5); }
.search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: none; border-radius: 8px; background: none; color: var(--gray); font-size: 18px; line-height: 1; cursor: pointer; display: none; }
.search-clear.on { display: block; }

.tiles-wrap { padding: 4px 0 2px; }
.tiles { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
.tiles::-webkit-scrollbar { display: none; }
.tile { flex: 0 0 auto; width: 84px; min-height: 92px; padding: 9px 6px 8px; background: rgba(10,26,12,0.8); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.25s var(--ease); font-family: var(--sans); color: var(--gray); }
.tile:active { transform: scale(0.96); }
.tile.active { background: rgba(45,106,79,0.3); border-color: rgba(82,183,136,0.55); color: var(--glow); }
.tile .ricon img { opacity: 0.82; transition: opacity 0.25s; }
.tile.active .ricon img { opacity: 1; }
.tile-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1; }
.tile-icon .ricon { width: 44px; height: 44px; }
.tile-icon svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tile-label { font-size: 11px; line-height: 1.25; text-align: center; letter-spacing: 0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

.ricon { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.ricon img { width: 100%; height: 100%; object-fit: contain; display: block; }

.block-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px 8px; }
.block-title { font-size: 11px; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
.block-count { font-size: 12px; color: var(--leaf); }

.pop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 6px; }
.pop-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; min-width: 0; transition: all 0.25s var(--ease); }
.pop-item:active { transform: scale(0.97); border-color: rgba(82,183,136,0.35); }
.pop-item span.nm { font-size: 13.5px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.flag { flex: 0 0 auto; width: 28px; height: 20px; border-radius: 4px; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: rgba(82,183,136,0.08); box-shadow: 0 0 0 1px rgba(183,228,199,0.14); font-size: 15px; line-height: 1; }
.flag img { width: 100%; height: 100%; object-fit: cover; display: block; }
.flag.big { width: 64px; height: 46px; border-radius: 8px; font-size: 34px; }

.rows { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.25s var(--ease); min-width: 0; }
.row:active { transform: scale(0.985); background: rgba(26,51,32,0.6); border-color: rgba(82,183,136,0.3); }
.row .nm { flex: 1; min-width: 0; font-size: 14.5px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12px; color: var(--gray); }
.row .chev { flex: 0 0 auto; color: var(--leaf); font-size: 18px; font-family: var(--serif); opacity: 0.8; }
.row.featured { border-color: rgba(82,183,136,0.32); background: linear-gradient(135deg, rgba(26,51,32,0.7) 0%, rgba(10,26,12,0.8) 100%); padding: 14px; }
.row.featured .ricon { width: 44px; height: 44px; font-size: 28px; flex: 0 0 auto; }
.row .col { flex: 1; min-width: 0; }
.row .col .nm { display: block; }

.crumb { display: flex; align-items: center; gap: 12px; padding: 6px 16px 4px; }
.back-btn { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; background: rgba(82,183,136,0.08); border: 1px solid var(--border); color: var(--glow); font-size: 20px; font-family: var(--serif); line-height: 1; cursor: pointer; }
.back-btn:active { background: rgba(82,183,136,0.16); }
.crumb .ricon { width: 42px; height: 42px; font-size: 26px; flex: 0 0 auto; }
.crumb-title { font-family: var(--serif); font-size: 24px; font-weight: 300; color: var(--mist); line-height: 1.15; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb-sub { font-size: 12px; color: var(--gray); }

.lines { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 2px; scrollbar-width: none; }
.lines::-webkit-scrollbar { display: none; }
.line-chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 12px; background: rgba(10,26,12,0.8); border: 1px solid var(--border); color: var(--gray); font-size: 12.5px; font-family: var(--sans); cursor: pointer; text-align: left; line-height: 1.3; transition: all 0.25s var(--ease); }
.line-chip b { display: block; font-weight: 500; color: var(--white); font-size: 13px; }
.line-chip.active { background: rgba(45,106,79,0.3); border-color: rgba(82,183,136,0.55); }
.line-chip.active b { color: var(--glow); }

.cov { margin: 10px 16px 0; border: 1px solid var(--border); border-radius: 12px; background: rgba(10,26,12,0.55); }

.state button { margin-top: 14px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--border); background: rgba(82,183,136,0.08); color: var(--glow); font-family: var(--sans); font-size: 13px; cursor: pointer; }

.m-dev .no::before { content: '✕'; color: #fbbf24; }

/* ── подбор тарифа: кнопка на главной, три вопроса, «наш выбор» ── */

.pick-custom { display: none; gap: 8px; padding: 10px 16px 0; }

.row.use { padding: 13px 14px; }

.pick-res { margin: 12px 16px 0; padding: 12px; border-radius: 16px; border: 1px solid rgba(82,183,136,0.4); background: linear-gradient(135deg, rgba(45,106,79,0.28) 0%, rgba(10,26,12,0.7) 100%); }

.pick-help { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: calc(100% - 32px); margin: 12px 16px 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(10,26,12,0.55); color: var(--glow); font-family: var(--sans); font-size: 13px; text-align: left; cursor: pointer; }

function wordForm(n, key) {
  const forms = (PLURALS[currentLang] || PLURALS.en)[key];
  if (forms.length === 1) return forms[0];
  let cat = n === 1 ? 'one' : 'other';
  try { cat = new Intl.PluralRules(currentLang).select(n); } catch (e) {}
  if (forms.length === 3) return cat === 'one' ? forms[0] : cat === 'few' ? forms[1] : forms[2];
  return cat === 'one' ? forms[0] : forms[1];
}

const KNOWN = new Map();      // id страны → { id, code, name }
const BY_CODE = new Map();    // код → страна
let ALL_COUNTRIES = [];       // полный список стран
let CONTINENTS = [];

function remember(list) {
  const out = [];
  for (const c of list || []) {
    if (!c || c.id == null || !c.code) continue;
    const item = { id: String(c.id), code: String(c.code).toLowerCase(), name: String(c.name || '') };
    KNOWN.set(item.id, item);
    if (!BY_CODE.has(item.code)) BY_CODE.set(item.code, item);
    out.push(item);
  }
  return out;
}

const displayNamesCache = {};
function displayNames(lang) {
  if (!(lang in displayNamesCache)) {
    try { displayNamesCache[lang] = new Intl.DisplayNames([lang], { type: 'region' }); }
    catch (e) { displayNamesCache[lang] = null; }
  }
  return displayNamesCache[lang];
}

// Стандартное название страны на нужном языке (как его знает браузер) или ''
function intlName(code, lang) {
  if (!/^[a-z]{2}$/.test(code)) return '';
  const dn = displayNames(lang);
  if (!dn) return '';
  try {
    const name = dn.of(code.toUpperCase());
    return name && name.toLowerCase() !== code ? name : '';
  } catch (e) { return ''; }
}

function countryName(c, lang) {
  lang = lang || currentLang;
  const code = String(c.code || '').toLowerCase();
  const fixed = (COUNTRY_OVERRIDES[lang] || {})[code];
  if (fixed) return fixed;
  const name = intlName(code, lang);
  if (name) return lang === 'ru' ? name.replace(/о-ва/g, 'острова') : name;
  return c.name || code.toUpperCase();
}

function regionName(cont, lang) {
  lang = lang || currentLang;
  if (!cont) return '';
  if (cont.code === 'ww') return (I18N[lang] || I18N.ru)['world'];
  return (REGION_NAMES[lang] || {})[cont.name] || cont.name;
}

function flagEmoji(code) {
  const c = String(code || '').toUpperCase();
  return /^[A-Z]{2}$/.test(c)
    ? String.fromCodePoint(...[...c].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65))
    : '🏝️';
}

// Флаг — картинка из папки flags рядом с приложением. Если файла нет, остаётся эмодзи.
function flagHtml(code, big) {
  let c = String(code || '').toLowerCase();
  const emoji = flagEmoji(c);
  c = FLAG_ALIAS[c] || c;
  const cls = 'flag' + (big ? ' big' : '');
  if (!/^[a-z]{2}$/.test(c) || NO_FLAG[c]) return `<span class="${cls}">${emoji}</span>`;
  return `<span class="${cls}"><img src="flags/${c}.svg" alt="" loading="lazy" onerror="this.replaceWith('${emoji}')"></span>`;
}

function regionIconHtml(code) {

  if (src) return `<span class="ricon"><img src="${esc(src)}" alt="" onerror="this.replaceWith('${REGION_EMOJI[code] || '🌐'}')"></span>`;
  return `<span class="ricon">${REGION_EMOJI[code] || '🌐'}</span>`;
}

const GLOBAL = { id: 'global', code: 'ww', name: 'Global' };
function continentById(id) { return CONTINENTS.find(c => String(c.id) === String(id)); }

// ── ПОИСК ──────────────────────────────────────────────────────────────
function norm(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е')
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}

const searchIndex = new Map();   // id страны → строка со всеми названиями
function searchText(c) {
  if (!searchIndex.has(c.id)) {
    const names = [];
    for (const lang of Object.keys(I18N)) names.push(countryName(c, lang), intlName(c.code, lang));
    searchIndex.set(c.id, ' ' + norm([c.name, c.code, SEARCH_ALIASES[c.code] || ''].concat(names).join(' ')) + ' ');
  }
  return searchIndex.get(c.id);
}

function rank(text, q) {       // 1 — слово начинается с запроса, 2 — запрос внутри слова, -1 — нет
  if (text.includes(' ' + q)) return 1;
  return text.includes(q) ? 2 : -1;
}

function search(query) {
  const q = norm(query);
  if (!q) return { regions: [], countries: [] };
  const regions = [GLOBAL].concat(CONTINENTS).map(r => {
    const text = ' ' + norm(Object.keys(I18N).map(lang => regionName(r, lang)).concat(
      r.name, r.code === 'ww' ? Object.keys(I18N).map(l => I18N[l]['tile-global']) : []).join(' ')) + ' ';
    return { r, k: rank(text, q) };
  }).filter(x => x.k >= 0).sort((a, b) => a.k - b.k).map(x => x.r);
  const pool = ALL_COUNTRIES.length ? ALL_COUNTRIES : Array.from(KNOWN.values());
  const popular = code => { const i = POPULAR.indexOf(code); return i < 0 ? 99 : i; };
  const countries = pool.map(c => {
    let k = rank(searchText(c), q);
    if (k > 0 && norm(countryName(c)).startsWith(q)) k = 0;   // название на языке экрана начинается с запроса
    return { c, k };
  }).filter(x => x.k >= 0)
    .sort((a, b) => a.k - b.k || popular(a.c.code) - popular(b.c.code) ||
      countryName(a.c).localeCompare(countryName(b.c), currentLang))
    .map(x => x.c);
  return { regions, countries };
}

// ── ЗАГРУЗКА ДАННЫХ ────────────────────────────────────────────────────
const CACHE_PREFIX = 'linkora_v2_';
function cacheGet(key, ttl) {
  try {
    const obj = JSON.parse(localStorage.getItem(CACHE_PREFIX + key) || 'null');
    return obj && Date.now() - obj.ts < ttl ? obj.body : null;
  } catch (e) { return null; }
}
function cacheSet(key, body) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), body })); } catch (e) {}
}

async function api(query, ttl, valid) {
  ttl = ttl || 30 * 60 * 1000;
  const hit = cacheGet(query, ttl);
  if (hit) return hit;
  const res = await fetch(`${API_URL}/api/packages?${query}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const body = await res.json();
  if (!body || !body.ok || !Array.isArray(body.data)) throw new Error((body && body.error) || 'bad response');
  if (valid && !valid(body.data)) throw new Error('unexpected response');
  cacheSet(query, body);
  return body;
}

async function loadContinents() {

// ── ТАРИФЫ: разбор, линейки, отбор лучших ──────────────────────────────
function normalizePackage(p) {
  const raw = String(p.name || '');
  const m = raw.match(/\bfor\s+\d+\s+Days?\s+for\s+(.+)$/i);
  const unlimited = Boolean(p.unlimited) || Number(p.gb) < 0;
  return {
    id: String(p.id), raw, gb: unlimited ? -1 : Number(p.gb) || 0, days: Number(p.days) || 0,
    price: Number(p.price) || 0, unlimited, plus: /unlimited\s+plus/i.test(raw),
    product: m ? m[1].trim() : '', cv: Number.isInteger(p.cv) ? p.cv : null,
  };
}

// Линейка = один продукт поставщика с одним списком стран.
// У «Европы», например, две линейки с одинаковыми названиями: на 37 и на 46 стран.
function buildLines(pkgs, coverage) {
  const map = new Map();
  for (const p of pkgs) {
    const key = p.product + '#' + (p.cv == null ? '' : p.cv);
    if (!map.has(key)) map.set(key, { key, product: p.product, cv: p.cv, pkgs: [] });
    map.get(key).pkgs.push(p);
  }
  let lines = Array.from(map.values());
  // Один-два тарифа с отдельным списком стран — не самостоятельная линейка: кладём их
  // в полный список линейки с тем же названием. В «лучшие» они не попадают.
  for (const small of lines.filter(l => l.pkgs.length <= 2)) {
    const host = lines.filter(l => l !== small && l.product === small.product && l.pkgs.length > 2)
      .sort((a, b) => b.pkgs.length - a.pkgs.length)[0];
    if (!host) continue;
    small.pkgs.forEach(p => { p.extra = true; host.pkgs.push(p); });
    small.merged = true;
  }
  lines = lines.filter(l => !l.merged);
  for (const line of lines) {
    line.codes = line.cv != null && coverage[line.cv] ? coverage[line.cv] : [];
    line.min = Math.min(...line.pkgs.filter(p => !p.extra).map(p => p.price));
  }
  lines.sort((a, b) => a.min - b.min || a.codes.length - b.codes.length);
  const products = Array.from(new Set(lines.map(l => l.product)));
  const words = products.map(p => p.split(/\s+/));
  let common = 0;   // общие первые слова в названиях («Global Lite», «Global Max» → «Lite», «Max»)
  while (products.length > 1 && words.every(w => w.length > common + 1 && w[common] === words[0][common])) common++;
  lines.forEach((line, i) => {
    line.title = products.length > 1 ? line.product.split(/\s+/).slice(common).join(' ') : '';
    line.index = i;
  });
  return lines;
}

function lineLabel(line) {
  const parts = [];
  if (line.title) parts.push(line.title);
  if (line.codes.length) parts.push(count(line.codes.length, 'countries'));
  return parts.length ? parts : [t('variant') + ' ' + (line.index + 1)];
}

function sortPlans(list) {
  return list.slice().sort((a, b) =>
    (a.unlimited - b.unlimited) || (a.plus - b.plus) || (a.unlimited ? a.days - b.days : a.gb - b.gb) ||
    a.days - b.days || a.price - b.price);
}

// Одинаковые тарифы (объём, срок, вид) от разных сетей: оставляем самый дешёвый
function dedupe(pkgs) {
  const best = new Map();
  for (const p of pkgs) {
    const key = [p.unlimited ? 'u' : 'd', p.plus ? 'p' : '', p.gb, p.days, p.cv == null ? '' : p.cv].join('|');
    if (!best.has(key) || p.price < best.get(key).price) best.set(key, p);
  }
  return Array.from(best.values());
}

function pickBest(pkgs) {
  const list = dedupe(pkgs);
  // 1) пакеты с гигабайтами: на каждый объём один тариф
  const bySize = new Map();
  for (const p of list.filter(p => !p.unlimited)) {
    if (!bySize.has(p.gb)) bySize.set(p.gb, []);
    bySize.get(p.gb).push(p);
  }
  let data = [];
  for (const options of bySize.values()) {
    const cheapest = Math.min(...options.map(p => p.price));
    const near = options.filter(p => p.price <= cheapest * BEST.sameSizeTolerance + 0.005);
    near.sort((a, b) => b.days - a.days || a.price - b.price);
    data.push(near[0]);
  }
  data.sort((a, b) => a.gb - b.gb);
  let keep = data.filter(p => p.gb <= BEST.maxGb);
  if (keep.length < BEST.minData) keep = data.slice(0, BEST.minData);
  keep = keep.slice(0, BEST.maxData);
  // 2) безлимит: обычный (если его нет — Plus), сроки рядом с 3, 7, 15 и 30 днями
  let unl = list.filter(p => p.unlimited && !p.plus);
  if (!unl.length) unl = list.filter(p => p.unlimited);
  const picked = new Map();
  for (const target of BEST.unlimitedDays) {
    let best = null;
    for (const p of unl) {
      if (!best || Math.abs(p.days - target) < Math.abs(best.days - target) ||
          (Math.abs(p.days - target) === Math.abs(best.days - target) && p.days > best.days)) best = p;
    }
    if (best && Math.abs(best.days - target) <= target / 2) picked.set(best.id, best);
  }
  const best = keep.concat(Array.from(picked.values()));
  return sortPlans(best.length ? best : list);
}

// ── ПОДБОР ТАРИФА ──────────────────────────────────────────────────────
// Три вопроса: куда, на сколько дней, для чего. Без нейросетей: расход в день × число дней,
// затем самый выгодный тариф каталога, которого хватит и по объёму, и по сроку.
// Расход интернета, ГБ в день — с запасом. Откуда цифры (расход приложений в час): карты 5 МБ, мессенджеры
// и звонки голосом до 30 МБ, сайты 60–75 МБ, лента Instagram ~0,4 ГБ, Reels и TikTok 0,7–1 ГБ,
// YouTube 480p ~0,5 ГБ и 1080p ~2 ГБ, видеозвонок 0,3–0,5 ГБ.
//   light  — час карт, переписка, час сайтов и такси: около 0,2 ГБ, с запасом 0,5
//   medium — то же плюс час ленты и музыка: около 0,7 ГБ, с запасом 1
//   heavy  — то же плюс час-два видео или раздача на ноутбук: 2–2,5 ГБ, с запасом 3
const USE_GB = { light: 0.5, medium: 1, heavy: 3 };
// Картинки для ответов (папка icons рядом с приложением); если картинка не загрузилась — значок из USE_EMOJI
const USE_ICON = { light: 'icons/use-light.png', medium: 'icons/use-medium.png', heavy: 'icons/use-heavy.png' };
const USE_EMOJI = { light: '💬', medium: '📸', heavy: '🎬' };
function useIconHtml(use) {
  return `<span class="use-ico"><img src="${USE_ICON[use]}" alt="" onerror="this.replaceWith('${USE_EMOJI[use]}')"></span>`;
}
const PICK_DAYS = [3, 5, 7, 10, 14, 21, 30];
// Значок кнопки «Подобрать тариф»: картинка icons/pick.png, а если её нет — нарисованный компас
const PICK_ICON = '<span class="pick-ico"><img src="icons/pick.png" alt="" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">' +
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg></span>';

// Возвращает { plan, need, short }: тариф, сколько ГБ нужно на поездку и чего не хватило
// (short: '' — всё подходит, 'data' — нет такого объёма, 'days' — нет такого срока).
function recommend(pkgs, days, use) {
  const need = Math.max(1, Math.round(days * (USE_GB[use] || USE_GB.medium) * 10) / 10);   // до десятых: 45 × 0,7 = 31,5, а не 31,49999
  const list = dedupe(pkgs.filter(p => !p.extra));
  if (!list.length) return null;
  const size = p => p.unlimited ? 1e9 : p.gb;
  // Расход примерный: 4,5 ГБ при нужных 4,9 тоже годятся. Безлимит подходит всем, кроме одного случая:
  // для видео и раздачи обычный безлимит не годится (после 1 ГБ в день скорость 512 кбит/с), годится только Plus.
  const enough = p => p.unlimited ? (use !== 'heavy' || p.plus) : p.gb >= need * 0.9;
  let pool = list.filter(p => p.days >= days), short = '';
  if (!pool.length) {                                // таких длинных тарифов нет: берём самые длинные
    const longest = Math.max(...list.map(p => p.days));
    pool = list.filter(p => p.days === longest);
    short = 'days';
  }
  const fit = pool.filter(enough);
  let plan;
  if (fit.length) {
    // при равной цене пакет с гигабайтами лучше безлимита: у него полная скорость без дневного порога
    const cheapest = fit.sort((a, b) => a.price - b.price || a.unlimited - b.unlimited || size(b) - size(a) || b.days - a.days)[0];
    // как и в списке лучших: тот же объём на более долгий срок, если он дороже не больше чем на 15%
    plan = fit.filter(p => size(p) === size(cheapest) && p.plus === cheapest.plus &&
      p.price <= cheapest.price * BEST.sameSizeTolerance + 0.005).sort((a, b) => b.days - a.days || a.price - b.price)[0];
  } else {
    plan = pool.sort((a, b) => size(b) - size(a) || a.price - b.price)[0];
    short = short || 'data';
  }
  return { plan, need, short };
}

// Безлимит у поставщика (eSIMCard) с дневным порогом: «Unlimited» — 1 ГБ в день на полной скорости,
// затем 512 кбит/с; «Unlimited Plus» — 2 ГБ в день, затем 2 Мбит/с. Об этом пишем в окне тарифа и в подборе.
function unlimitedNote(p) { return p && p.unlimited ? t(p.plus ? 'unl-plus-note' : 'unl-note') : ''; }

// Линейка, в которой подходящий тариф дешевле всего
function pickLine(lines, pick) {
  let best = 0, bestKey = null;
  lines.forEach((line, i) => {
    const r = recommend(line.pkgs, pick.days, pick.use);
    if (!r) return;
    const key = [r.short ? 1 : 0, r.plan.price];
    if (!bestKey || key[0] < bestKey[0] || (key[0] === bestKey[0] && key[1] < bestKey[1])) { best = i; bestKey = key; }
  });
  return best;
}

function fmtNum(n) {
  try { return Number(n).toLocaleString(currentLang, { maximumFractionDigits: 1 }); } catch (e) { return String(n); }
}

// ── СОСТОЯНИЕ ЭКРАНА ───────────────────────────────────────────────────
// view.kind: home | continent | plans | pick.  plans.scope: country | regional | global
// pick — подбор тарифа: step 1 (куда), 2 (на сколько дней), 3 (для чего); ответ — plans с полем pick
let view = { kind: 'home' };
let navStack = [];
let viewToken = 0;
let countriesState = 'loading';
let searchQuery = '';
let plans = null;          // { state, lines, lineIndex, showAll, error }
let continentCountries = null;   // { state, list }
let selectedPkg = null;
let currentPage = 'catalog';

const $ = id => document.getElementById(id);

function go(next) {
  navStack.push(view);
  if (navStack.length > 20) navStack.shift();
  open(next);
}

function back() {
  if ($('modal').classList.contains('open')) return closeModal();
  if (searchQuery) return setSearch('');
  if (currentPage !== 'catalog') return showPage('catalog');
  open(navStack.pop() || { kind: 'home' });
}

function open(next) {
  view = next;
  viewToken++;
  if (searchQuery) setSearch('', true);
  if (view.kind === 'continent') loadContinent(view.id);
  else if (view.kind === 'plans') loadPlans();
  render();
  $('catalogScroll').scrollTop = 0;
}

async function loadContinent(id) {
  const token = viewToken;
  continentCountries = { state: 'loading', list: [] };
  try {
    const body = await api('type=countries&id=' + encodeURIComponent(id));
    if (token !== viewToken) return;
    const sets = Number(body.sets) || 0;
    const partial = new Set(body.data.filter(c => sets > 1 && Number(c.n) < sets).map(c => String(c.id)));
    const list = remember(body.data);
    // extra — страны, которые входят не во все тарифы региона (только в расширенный)
    continentCountries = { state: 'ok', list: list.filter(c => !partial.has(c.id)), extra: list.filter(c => partial.has(c.id)) };
    if (!continentCountries.list.length) continentCountries = { state: 'ok', list, extra: [] };
  } catch (e) {
    if (token !== viewToken) return;
    continentCountries = { state: 'error', list: [] };
  }
  render();
}

function plansQuery() {
  if (view.scope === 'global') return 'type=global';
  if (view.scope === 'regional') return 'type=regional&id=' + encodeURIComponent(view.id);
  const c = KNOWN.get(String(view.id)) || { name: '', code: '' };
  return `type=country&id=${encodeURIComponent(view.id)}&name=${encodeURIComponent(c.name)}&code=${encodeURIComponent(c.code)}`;
}

async function loadPlans() {
  const token = viewToken;
  plans = { state: 'loading', lines: [], coverage: [], lineIndex: 0, showAll: false };
  try {
    const body = await api(plansQuery());
    if (token !== viewToken) return;
    const pkgs = body.data.map(normalizePackage).filter(p => p.price > 0 && p.days > 0 && (p.unlimited || p.gb > 0));
    const coverage = Array.isArray(body.coverage) ? body.coverage : [];
    plans = { state: 'ok', lines: buildLines(pkgs, coverage), coverage, lineIndex: 0, showAll: false };
    if (view.pick) plans.lineIndex = pickLine(plans.lines, view.pick);
  } catch (e) {
    if (token !== viewToken) return;
    plans = { state: 'error', lines: [], coverage: [], lineIndex: 0, showAll: false };
  }
  render();
}

// ── ОТРИСОВКА ──────────────────────────────────────────────────────────
const GRID_ICON = '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>';

function activeTile() {
  if (searchQuery) return '';
  if (view.kind === 'home') return 'all';
  if (view.kind === 'continent') return 'c' + view.id;
  if (view.kind === 'plans') {
    if (view.scope === 'global') return 'global';
    if (view.scope === 'regional') return 'c' + view.id;
    return view.from ? 'c' + view.from : 'all';
  }
  return '';
}

let lastActiveTile = null, lastTilesScroll = 0;

function renderTiles() {
  const active = activeTile();
  lastTilesScroll = $('tiles').scrollLeft;
  const tile = (key, act, id, icon, label) =>
    `<button type="button" class="tile${active === key ? ' active' : ''}" data-act="${act}" data-id="${esc(id)}">` +
    `<span class="tile-icon">${icon}</span><span class="tile-label">${esc(label)}</span></button>`;
  $('tiles').innerHTML =
    tile('all', 'home', '', GRID_ICON, t('tile-all')) +
    tile('global', 'global', '', regionIconHtml('ww'), t('tile-global')) +
    CONTINENTS.map(c => tile('c' + c.id, 'continent', c.id, regionIconHtml(c.code), regionName(c))).join('');
  const box = $('tiles'), on = box.querySelector('.tile.active');
  if (active !== lastActiveTile && on) box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
  else box.scrollLeft = lastTilesScroll;
  lastActiveTile = active;
}

function stateHtml(kind, text) {
  if (kind === 'loading') return `<div class="state"><div class="spin"></div>${esc(t('loading'))}</div>`;
  if (kind === 'error') return `<div class="state">${esc(t('load-error'))}<br><button type="button" data-act="retry">${esc(t('retry'))}</button></div>`;
  return `<div class="state">${esc(text)}</div>`;
}

function countryRow(c, from) {
  return `<div class="row" data-act="country" data-id="${esc(c.id)}" data-from="${esc(from || '')}">` +
    `${flagHtml(c.code)}<span class="nm">${esc(countryName(c))}</span><span class="chev">›</span></div>`;
}

function sortedByName(list) {
  return list.slice().sort((a, b) => countryName(a).localeCompare(countryName(b), currentLang));
}

function renderHome() {
  let html = `<div class="pick-cta" data-act="pick">${PICK_ICON}<div class="col">` +
    `<span class="nm">${esc(t('pick-cta'))}</span><div class="sub">${esc(t('pick-cta-sub'))}</div></div><span class="chev">›</span></div>`;
  const popular = POPULAR.map(code => BY_CODE.get(code)).filter(Boolean);
  if (popular.length) {
    html += `<div class="block-head"><div class="block-title">${esc(t('popular'))}</div></div><div class="pop-grid">` +
      popular.map(c => `<div class="pop-item" data-act="country" data-id="${esc(c.id)}">${flagHtml(c.code)}<span class="nm">${esc(countryName(c))}</span></div>`).join('') +
      '</div>';
  }
  html += `<div class="block-head"><div class="block-title">${esc(t('all-countries-h'))}</div>` +
    `<div class="block-count">${ALL_COUNTRIES.length || ''}</div></div>`;
  if (countriesState !== 'ok') return html + stateHtml(countriesState);
  return html + '<div class="rows">' + sortedByName(ALL_COUNTRIES).map(c => countryRow(c)).join('') + '</div>';
}

function crumb(icon, title, sub) {
  return `<div class="crumb"><button type="button" class="back-btn" data-act="back" aria-label="Back">‹</button>${icon}` +
    `<div style="min-width:0"><div class="crumb-title">${esc(title)}</div>${sub ? `<div class="crumb-sub">${esc(sub)}</div>` : ''}</div></div>`;
}

function renderContinent() {
  const cont = continentById(view.id) || { id: view.id, code: '', name: '' };
  const name = regionName(cont);
  let html = crumb(regionIconHtml(cont.code), name) +
    `<div class="rows" style="padding-top:10px;padding-bottom:4px"><div class="row featured" data-act="regional" data-id="${esc(cont.id)}">` +
    `${regionIconHtml(cont.code)}<div class="col"><div class="pkg-featured-badge">${esc(t('regional-badge'))}</div>` +
    `<span class="nm">${esc(name)} — ${esc(t('all-countries'))}</span><div class="sub">${esc(t('regional-sub'))}</div></div>` +
    '<span class="chev">›</span></div></div>';
  const st = continentCountries || { state: 'loading', list: [] };
  html += `<div class="block-head"><div class="block-title">${esc(t('countries-h'))}</div>` +
    `<div class="block-count">${st.list.length || ''}</div></div>`;
  if (st.state !== 'ok') return html + stateHtml(st.state);
  if (!st.list.length) return html + stateHtml('empty', t('not-found'));
  html += '<div class="rows">' + sortedByName(st.list).map(c => countryRow(c, cont.id)).join('') + '</div>';
  if (st.extra && st.extra.length) {
    html += `<div class="block-head" style="padding-top:0"><div class="block-title">${esc(t('extra-h'))}</div>` +
      `<div class="block-count">${st.extra.length}</div></div>` +
      '<div class="rows">' + sortedByName(st.extra).map(c => countryRow(c, cont.id)).join('') + '</div>';
  }
  return html;
}

function placeInfo(v) {        // страна, регион или весь мир: значок и название
  if (v.scope === 'global') return { icon: regionIconHtml('ww'), big: regionIconHtml('ww'), name: t('world') };
  if (v.scope === 'regional') {
    const cont = continentById(v.id) || { code: '', name: '' };
    return { icon: regionIconHtml(cont.code), big: regionIconHtml(cont.code), name: regionName(cont) };
  }
  const c = KNOWN.get(String(v.id)) || { code: '', name: '' };
  return { icon: flagHtml(c.code), big: flagHtml(c.code, true), name: countryName(c) };
}
function placeOfPlans() { return placeInfo(view); }      // что покрывает открытый список тарифов

function dataLabel(p) { return p.unlimited ? t('unlimited') : `${p.gb} ${t('gb')}`; }

function coverageNames(codes) {
  return codes.map(code => countryName(BY_CODE.get(code) || { code, name: code.toUpperCase() }))
    .sort((a, b) => a.localeCompare(b, currentLang));
}

function currentLine() { return plans && plans.lines[plans.lineIndex]; }

function visiblePlans() {
  const line = currentLine();
  if (!line) return [];
  return plans.showAll ? sortPlans(dedupe(line.pkgs)) : pickBest(line.pkgs.filter(p => !p.extra));
}

// Страны, в которых работает именно этот тариф
function codesOf(p, line) {
  const own = p.cv != null && plans && plans.coverage[p.cv];
  return own && own.length ? own : line.codes;
}

function planCard(p, line) {
  return `<div class="plan" data-act="plan" data-id="${esc(p.id)}"><div>` +
    `<div class="plan-data">${esc(dataLabel(p))}${p.plus ? '<small>PLUS</small>' : ''}</div>` +
    `<div class="plan-meta">${esc(count(p.days, 'days'))}${p.extra ? ' · ' + esc(count(codesOf(p, line).length, 'countries')) : ''}</div></div>` +
    `<div class="pkg-right"><div class="pkg-price">${esc(money(p.price))}</div>` +
    `<div class="pkg-per">${esc(money(p.price / p.days))}/${esc(t('per-day'))}</div></div></div>`;
}

// «Наш выбор»: тариф, подобранный по ответам, и откуда взялась цифра
function pickBlock(line) {
  const pick = view.pick, r = recommend(line.pkgs, pick.days, pick.use);
  if (!r) return '';
  const days = count(pick.days, 'days'), need = Math.max(1, Math.round(r.need));
  const why = t('pick-why').replace('{days}', days).replace('{rate}', fmtNum(USE_GB[pick.use] || USE_GB.medium)).replace('{need}', need);
  const warn = r.short === 'days' ? t('pick-short-days').replace('{days}', days)
    : r.short === 'data' ? t('pick-short-data').replace('{need}', need) : '';
  return `<div class="pick-res"><div class="pick-res-head"><span class="pkg-featured-badge">${esc(t('pick-badge'))}</span>` +
    `<button type="button" class="pick-edit" data-act="back">${esc(t('pick-edit'))}</button></div>` +
    planCard(r.plan, line) + `<div class="pick-why">${esc(why)}</div>` +
    (warn ? `<div class="pick-why warn">${esc(warn)}</div>` : '') +
    (r.plan.unlimited ? `<div class="pick-why warn">${esc(unlimitedNote(r.plan))}</div>` : '') + '</div>';
}

function renderPlans() {
  const place = placeOfPlans();
  if (!plans || plans.state !== 'ok') return crumb(place.icon, place.name) + stateHtml(plans ? plans.state : 'loading');
  if (!plans.lines.length) return crumb(place.icon, place.name) + stateHtml('empty', t('no-plans'));
  const line = currentLine();
  let html = crumb(place.icon, place.name, line.codes.length && plans.lines.length === 1 ? count(line.codes.length, 'countries') : '');
  if (plans.lines.length > 1) {
    html += '<div class="lines">' + plans.lines.map((l, i) => {
      const label = lineLabel(l);
      return `<button type="button" class="line-chip${i === plans.lineIndex ? ' active' : ''}" data-act="line" data-id="${i}">` +
        `<b>${esc(label[0])}</b>${label[1] ? esc(label[1]) + ' · ' : ''}${esc(priceFrom(l.min))}</button>`;
    }).join('') + '</div>';
  }
  if (line.codes.length) {
    html += `<details class="cov"><summary>${esc(count(line.codes.length, 'countries'))} · ${esc(t('cov-list'))}</summary>` +
      `<p>${esc(coverageNames(line.codes).join(', '))}</p></details>`;
  }
  if (view.pick) html += pickBlock(line);
  else html += `<button type="button" class="pick-help" data-act="pick-here"><span>${esc(t('pick-help'))}</span><i>›</i></button>`;
  const list = visiblePlans();
  const total = dedupe(line.pkgs).length;
  html += `<div class="block-head"><div class="block-title">${esc(t('plans-h'))}</div>` +
    `<div class="block-count">${esc(count(list.length, 'plans'))}</div></div>`;
  if (!plans.showAll && list.length < total) html += `<div class="note">${esc(t('best-note'))}</div>`;
  html += '<div class="plans">' + list.map(p => planCard(p, line)).join('') + '</div>';
  if (plans.showAll) html += `<button type="button" class="ghost-btn" data-act="toggle-all">${esc(t('show-best'))}</button>`;
  else if (list.length < total) html += `<button type="button" class="ghost-btn" data-act="toggle-all">${esc(t('show-all').replace('{n}', total))}</button>`;
  else html += '<div style="height:16px"></div>';
  return html;
}

// ── ПОДБОР ТАРИФА: три экрана с вопросами ──────────────────────────────
function pickHead(step, place) {
  const info = place ? placeInfo(place) : { icon: PICK_ICON, name: t('pick-title') };
  return crumb(info.icon, info.name, t('pick-step').replace('{n}', step)) +
    '<div class="pick-steps">' + [1, 2, 3].map(i => `<i${i <= step ? ' class="on"' : ''}></i>`).join('') + '</div>';
}

function pickPlaceRow(scope, id, icon, name, sub) {
  return `<div class="row" data-act="pick-place" data-scope="${scope}" data-id="${esc(id)}">${icon}` +
    (sub ? `<div class="col"><span class="nm">${esc(name)}</span><div class="sub">${esc(sub)}</div></div>` : `<span class="nm">${esc(name)}</span>`) +
    '<span class="chev">›</span></div>';
}
function pickRegionRow(r) {
  return r.code === 'ww' ? pickPlaceRow('global', '', regionIconHtml('ww'), t('world'), t('tile-global'))
    : pickPlaceRow('regional', r.id, regionIconHtml(r.code), regionName(r), t('regional-sub'));
}

// Шаг 1: страны и регионы под полем ввода (обновляется при каждой букве, поле при этом не трогаем)
function pickPlacesHtml(query) {
  if (countriesState !== 'ok') return stateHtml(countriesState);
  if (query) {
    const found = search(query);
    const rows = found.countries.slice(0, 30).map(c => pickPlaceRow('country', c.id, flagHtml(c.code), countryName(c)))
      .concat(found.regions.map(pickRegionRow));
    return rows.length ? `<div class="rows" style="padding-top:4px">${rows.join('')}</div>` : stateHtml('empty', t('not-found'));
  }
  const popular = POPULAR.map(code => BY_CODE.get(code)).filter(Boolean);
  let html = '';
  if (popular.length) {
    html += `<div class="block-head" style="padding-top:8px"><div class="block-title">${esc(t('popular'))}</div></div><div class="pop-grid">` +
      popular.map(c => `<div class="pop-item" data-act="pick-place" data-scope="country" data-id="${esc(c.id)}">${flagHtml(c.code)}<span class="nm">${esc(countryName(c))}</span></div>`).join('') +
      '</div>';
  }
  html += `<div class="block-head"><div class="block-title">${esc(t('pick-multi'))}</div></div>` +
    '<div class="rows">' + CONTINENTS.concat([GLOBAL]).map(pickRegionRow).join('') + '</div>';
  return html;
}

function renderPick() {
  if (view.step === 1) {
    return pickHead(1) + `<div class="pick-q">${esc(t('pick-q1'))}</div>` +
      '<div class="search-box pick-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      `<input type="text" inputmode="search" id="pickInput" class="search-input" autocomplete="off" autocapitalize="off" autocorrect="off" ` +
      `spellcheck="false" enterkeyhint="search" placeholder="${esc(t('search-ph'))}" value="${esc(view.q || '')}"></div>` +
      `<div id="pickResults">${pickPlacesHtml(String(view.q || '').trim())}</div>`;
  }
  if (view.step === 2) {
    return pickHead(2, view.place) + `<div class="pick-q">${esc(t('pick-q2'))}</div><div class="pick-days">` +
      PICK_DAYS.map(n => `<button type="button" class="pick-day" data-act="pick-days" data-id="${n}"><b>${n}</b><span>${esc(wordForm(n, 'days'))}</span></button>`).join('') +
      `<button type="button" class="pick-day other" data-act="pick-other"><b>…</b><span>${esc(t('pick-other'))}</span></button></div>` +
      `<div class="pick-custom" id="pickCustom"><input type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="365" id="pickDays" ` +
      `placeholder="${esc(t('pick-days-ph'))}"><button type="button" data-act="pick-days-custom">${esc(t('pick-next'))}</button></div>`;
  }
  return pickHead(3, view.place) + `<div class="pick-q">${esc(t('pick-q3'))}</div><div class="rows">` +
    Object.keys(USE_GB).map(use => `<div class="row use" data-act="pick-use" data-id="${use}">${useIconHtml(use)}` +
      `<div class="col"><span class="nm">${esc(t('use-' + use))}</span><div class="sub">${esc(t('use-' + use + '-sub'))}</div>` +
      `<div class="rate">${esc(t('pick-rate').replace('{n}', fmtNum(USE_GB[use])))}</div></div><span class="chev">›</span></div>`).join('') + '</div>';
}

function pickDays(n) {         // ответ на второй вопрос
  n = Math.round(Number(n));
  if (!(n >= 1 && n <= 365)) { const box = $('pickDays'); if (box) box.focus(); return; }
  go({ kind: 'pick', step: 3, place: view.place, days: n });
}

function renderSearch() {
  const found = search(searchQuery);
  const total = found.regions.length + found.countries.length;
  if (!total) {
    return countriesState === 'loading' ? stateHtml('loading') : stateHtml('empty', t('not-found'));
  }
  let html = `<div class="block-head"><div class="block-title">${esc(t('results-h'))}</div><div class="block-count">${total}</div></div><div class="rows">`;
  html += found.regions.map(r => r.code === 'ww'
    ? `<div class="row featured" data-act="global">${regionIconHtml('ww')}<div class="col"><span class="nm">${esc(t('world'))}</span><div class="sub">${esc(t('tile-global'))}</div></div><span class="chev">›</span></div>`
    : `<div class="row featured" data-act="continent" data-id="${esc(r.id)}">${regionIconHtml(r.code)}<div class="col"><span class="nm">${esc(regionName(r))}</span><div class="sub">${esc(t('regional-badge'))}</div></div><span class="chev">›</span></div>`
  ).join('');
  html += found.countries.map(c => countryRow(c)).join('');
  return html + '</div>';
}

function render() {
  const home = view.kind === 'home' && !searchQuery;
  $('hero').classList.toggle('compact', !home);
  $('catalogScroll').classList.toggle('picking', view.kind === 'pick' && !searchQuery);
  renderTiles();
  let html;
  if (searchQuery) html = renderSearch();
  else if (view.kind === 'pick') html = renderPick();
  else if (view.kind === 'continent') html = renderContinent();
  else if (view.kind === 'plans') html = renderPlans();
  else html = renderHome();
  const typing = document.activeElement && document.activeElement.id === 'pickInput';
  $('content').innerHTML = html;
  if (typing && $('pickInput')) {      // экран перерисовался, пока человек печатал страну: возвращаем курсор в поле
    const box = $('pickInput');
    box.focus();
    try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) {}
  }
  updateBackButton();
}

function updateBackButton() {
  if (!tg || !tg.BackButton) return;
  const need = $('modal').classList.contains('open') || currentPage !== 'catalog' || view.kind !== 'home' || Boolean(searchQuery);
  try { need ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

// ── ПОИСК: поле ввода ──────────────────────────────────────────────────
function setSearch(value, silent) {
  searchQuery = String(value || '').trim();
  if ($('searchInput').value.trim() !== searchQuery) $('searchInput').value = value || '';
  $('searchClear').classList.toggle('on', Boolean($('searchInput').value));
  if (!silent) { render(); if (searchQuery) $('catalogScroll').scrollTop = Math.min($('catalogScroll').scrollTop, $('hero').offsetHeight); }
}

// ── ОКНО ТАРИФА ────────────────────────────────────────────────────────
function openModal(id, keepHint) {
  const line = currentLine();
  selectedPkg = line && line.pkgs.find(p => p.id === String(id));
  if (!selectedPkg) return;
  const place = placeOfPlans();
  const p = selectedPkg;
  $('mFlag').innerHTML = place.big;
  $('mName').textContent = place.name;
  $('mRegion').textContent = `${dataLabel(p)}${p.plus ? ' Plus' : ''} · ${count(p.days, 'days')}`;
  $('mData').textContent = dataLabel(p) + (p.plus ? ' Plus' : '');
  $('mDays').textContent = count(p.days, 'days');
  $('mUnlNote').textContent = unlimitedNote(p);
  $('mUnlNote').classList.toggle('on', p.unlimited);
  const codes = codesOf(p, line);
  $('mCoverage').textContent = codes.length ? count(codes.length, 'countries') + ' ›' : place.name;
  $('mCovRow').classList.toggle('tap', codes.length > 0);
  $('mCovList').classList.remove('open');
  $('mCovList').textContent = codes.length ? coverageNames(codes).join(', ') : '';
  if (!keepHint) $('mDevHint').classList.remove('open');
  $('mPrice').textContent = money(p.price);
  $('mPerDay').textContent = `${money(p.price / p.days)} / ${t('per-day')}`;
  $('buySection').style.display = 'block';
  $('paySection').style.display = 'none';
  $('offlineBox').style.display = 'none';
  $('modal').classList.add('open');
  checkShop();
  updateBackButton();
}

function closeModal() {
  $('modal').classList.remove('open');
  $('mDevHint').classList.remove('open');
  $('buySection').style.display = 'block';
  $('paySection').style.display = 'none';
  $('offlineBox').style.display = 'none';
  updateBackButton();
}

function updatePayNotes() {
  if (!selectedPkg) return;
  const stars = Math.max(MIN_STARS, Math.round(selectedPkg.price * STARS_PER_USD));
  $('starsNote').textContent = t('stars-note').replace('{n}', stars.toLocaleString(currentLang));
  $('cryptoNote').textContent = t('crypto-note');
}

// ── НА СВЯЗИ ЛИ БОТ ────────────────────────────────────────────────────
// Счёт выставляет бот. Если он выключен, заказ некому обработать, поэтому каталог
// заранее спрашивает у API, на связи ли бот, и не даёт оформить оплату впустую.
let shopOnline = null;      // true / false; null — узнать не удалось, считаем, что на связи
let shopCheckedAt = 0;
let shopCheckNo = 0;

async function checkShop(force) {
  if (!force && Date.now() - shopCheckedAt < 30000) return shopOnline;
  shopCheckedAt = Date.now();
  const no = ++shopCheckNo;
  let online = null;
  try {
    // при ручной проверке обходим минутный кэш ответа
    const res = await fetch(`${API_URL}/api/status${force ? '?t=' + Date.now() : ''}`);
    const body = res.ok ? await res.json() : null;
    if (body && body.ok) online = body.online !== false;
  } catch (e) {}
  if (no !== shopCheckNo) return shopOnline;   // пока ждали ответ, уже есть более свежий
  shopOnline = online;
  showShopState();
  return shopOnline;
}

function payStep() {     // открыт ли в окне тарифа шаг оплаты
  return $('modal').classList.contains('open') && $('buySection').style.display === 'none';
}

function showPayStep() {
  $('buySection').style.display = 'none';
  const offline = shopOnline === false;
  $('offlineBox').style.display = offline ? 'block' : 'none';
  $('paySection').style.display = offline ? 'none' : 'block';
  updatePayNotes();
}

function revealPayStep() {   // на невысоких экранах кнопки оплаты и предупреждение оказываются ниже края окна
  const el = shopOnline === false ? $('offlineBox') : $('paySection');
  try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
}

function showShopState() {
  $('offlineBar').classList.toggle('on', shopOnline === false);
  if (payStep()) showPayStep();
}

let payInProgress = false;

// Заказ уходит в очередь API (/api/pending), бот забирает его за несколько секунд и присылает счёт в чат.
// Цену бот считает сам по данным поставщика: то, что отправлено отсюда, на сумму не влияет.
async function selectPayment(method) {
  if (!selectedPkg || payInProgress) return;
  const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
  if (!userId) { notify(t('open-via-bot')); return; }

  const p = selectedPkg;
  const pkgData = {
    action: "pay", id: p.id, name: p.raw, gb: p.unlimited ? -1 : p.gb, days: p.days,
    price: p.price, unlimited: p.unlimited, method,
  };
  payInProgress = true;
  $('payStars').disabled = true; $('payCrypto').disabled = true;
  try {
    const res = await fetch(`${API_URL}/api/pending`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telegram_id: userId, pkg: pkgData }),
    });
    const body = await res.json().catch(() => null);
    if (body && body.error === 'bot_offline') {   // бот выключился, пока клиент выбирал
      shopOnline = false; shopCheckedAt = Date.now(); shopCheckNo++;
      showShopState();
      revealPayStep();
      return;
    }
    if (!res.ok || !body || !body.ok) throw new Error("API " + res.status);
    try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    tg.close();
  } catch (e) {
    notify('⚠️ ' + t('order-fail'));
  } finally {
    payInProgress = false;
    $('payStars').disabled = false; $('payCrypto').disabled = false;
  }
}

// ── СТРАНИЦЫ И ЯЗЫК ────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $('page-' + name).classList.add('active');
  $('nav-' + name).classList.add('active');
  currentPage = name;
  updateBackButton();
}

function applyLang() {
  document.documentElement.lang = currentLang;
  const ids = ['hero-badge', 'hero-t1', 'hero-em', 'hero-sub', 'stat-countries', 'stat-speed', 'stat-support',
    'nav-catalog', 'nav-orders', 'nav-support', 'orders-tag', 'orders-card-title', 'orders-hint',
    'support-tag', 'support-card-title', 'support-text', 'activate-title', 'close-btn',
    'modal-data', 'modal-days', 'modal-coverage', 'modal-network', 'modal-activation', 'modal-instant',
    'device-q', 'device-check', 'device-intro', 'device-dial', 'device-yes', 'device-no', 'device-more',
    'buy-btn', 'pay-stars', 'pay-crypto'];
  ids.forEach(key => { const el = $('t-' + key); if (el) el.textContent = t(key); });
  $('ordersClose').textContent = t('orders-btn');
  $('supportBtn').textContent = t('support-btn');
  const accent = text => `<em style="font-style:italic;color:var(--glow);">${esc(text)}</em>`;
  $('t-orders-title').innerHTML = `${esc(t('orders-t1'))} ${accent(t('orders-em'))}`;
  $('t-support-title').innerHTML = `${esc(t('support-t1'))} ${accent(t('support-em'))}`;
  $('t-activate-text').innerHTML = `<strong style="color:var(--mist);">iPhone:</strong> ${esc(t('activate-text-iphone'))}<br><br>` +
    `<strong style="color:var(--mist);">Android:</strong> ${esc(t('activate-text-android'))}`;
  $('searchInput').placeholder = t('search-ph');
  $('langCode').textContent = currentLang.toUpperCase();
  document.querySelectorAll('.lang-item').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
  render();
  $('t-offline-banner').textContent = t('offline-banner');
  $('t-offline-text').textContent = t('offline-text');
  $('offlineRetry').textContent = t('offline-retry');
  if ($('modal').classList.contains('open') && selectedPkg) { const paying = payStep(); openModal(selectedPkg.id, true); if (paying) showPayStep(); }
}

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('linkora_miniapp_lang', lang); } catch (e) {}
  $('langMenu').classList.remove('open');
  applyLang();
}

// ── СОБЫТИЯ ────────────────────────────────────────────────────────────
function onAction(el) {
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'home') { navStack = []; open({ kind: 'home' }); }
  else if (act === 'global') go({ kind: 'plans', scope: 'global' });
  else if (act === 'continent') go({ kind: 'continent', id });
  else if (act === 'regional') go({ kind: 'plans', scope: 'regional', id });
  else if (act === 'country') go({ kind: 'plans', scope: 'country', id, from: el.dataset.from || '' });
  else if (act === 'back') back();
  else if (act === 'line') { plans.lineIndex = Number(id) || 0; plans.showAll = false; render(); }
  else if (act === 'toggle-all') { plans.showAll = !plans.showAll; render(); }
  else if (act === 'plan') openModal(id);
  else if (act === 'pick') go({ kind: 'pick', step: 1 });
  else if (act === 'pick-here') go({ kind: 'pick', step: 2, place: { scope: view.scope, id: view.id || '', from: view.from || '' } });
  else if (act === 'pick-place') go({ kind: 'pick', step: 2, place: { scope: el.dataset.scope, id: id || '', from: '' } });
  else if (act === 'pick-days') pickDays(id);
  else if (act === 'pick-other') { $('pickCustom').classList.add('on'); $('pickDays').focus(); }
  else if (act === 'pick-days-custom') pickDays($('pickDays').value);
  else if (act === 'pick-use') go(Object.assign({ kind: 'plans' }, view.place, { pick: { days: view.days, use: id } }));
  else if (act === 'retry') {
    if (view.kind === 'home' || view.kind === 'pick') { countriesState = 'loading'; render(); loadAllCountries(); loadContinents(); }
    else open(view);
  }
}

document.addEventListener('click', e => {
  const actor = e.target.closest('[data-act]');
  if (actor) return onAction(actor);
  const langItem = e.target.closest('.lang-item');
  if (langItem) return setLang(langItem.dataset.lang);
  if (e.target.closest('#langBtn')) return $('langMenu').classList.toggle('open');
  if (!e.target.closest('#langSwitcher')) $('langMenu').classList.remove('open');
  const nav = e.target.closest('.nav-item');
  if (nav) return showPage(nav.dataset.page);
  if (e.target.closest('#ordersBtn')) return showPage('orders');
  if (e.target.closest('#ordersClose')) { if (tg && tg.initData) { try { tg.close(); return; } catch (err) {} } return showPage('catalog'); }
  if (e.target.closest('#supportBtn')) {
    const url = 'https://t.me/linkorasupport';
    try { if (tg && tg.openTelegramLink && tg.initData) return tg.openTelegramLink(url); } catch (err) {}
    return void window.open(url, '_blank');
  }
  if (e.target.closest('#searchClear')) { setSearch(''); $('searchInput').focus(); return; }
  if (e.target === $('modal') || e.target.closest('#t-close-btn')) return closeModal();
  if (e.target.closest('#mCovRow.tap')) return $('mCovList').classList.toggle('open');
  if (e.target.closest('#mDevRow')) {   // как проверить, что телефон поддерживает eSIM
    const hint = $('mDevHint');
    if (hint.classList.toggle('open')) { try { hint.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (err) {} }
    return;
  }
  if (e.target.closest('#t-buy-btn')) { showPayStep(); revealPayStep(); return void checkShop(); }
  if (e.target.closest('#offlineRetry')) {
    const btn = $('offlineRetry');
    btn.disabled = true;   // кнопка гаснет хотя бы на полсекунды, чтобы было видно, что проверка прошла
    return void Promise.all([checkShop(true), new Promise(r => setTimeout(r, 500))]).then(() => { btn.disabled = false; });
  }
  if (e.target.closest('#payStars')) return selectPayment('stars');
  if (e.target.closest('#payCrypto')) return selectPayment('crypto');
});

$('searchInput').addEventListener('input', e => setSearch(e.target.value));
document.addEventListener('input', e => {       // шаг 1 подбора: список под полем меняется, само поле остаётся на месте
  if (e.target.id !== 'pickInput' || view.kind !== 'pick') return;
  view.q = e.target.value;
  $('pickResults').innerHTML = pickPlacesHtml(view.q.trim());
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pickInput') e.target.blur();
  if (e.target.id === 'pickDays') pickDays(e.target.value);
});
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

if (tg && tg.BackButton) { try { tg.BackButton.onClick(back); } catch (e) {} }

// ── PARTICLES ──────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
class Particle {
  constructor() { this.reset(true); }
  reset(init=false) {
    this.x=Math.random()*canvas.width; this.y=init?Math.random()*canvas.height:canvas.height+10;
    this.size=Math.random()*2.5+0.5; this.speed=Math.random()*0.3+0.08;
    this.vx=(Math.random()-0.5)*0.3; this.opacity=Math.random()*0.35+0.05;
    this.color=Math.random()>0.5?'#52b788':'#74c69d';
    this.isLeaf=Math.random()>0.6; this.rot=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.015;
  }
  update() {
    this.y-=this.speed; this.x+=this.vx+Math.sin(this.y*0.008)*0.2;
    this.rot+=this.rotSpeed; if(this.y<-10)this.reset();
  }
  draw() {
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.globalAlpha=this.opacity; ctx.fillStyle=this.color;
    if(this.isLeaf){ctx.beginPath();ctx.ellipse(0,0,this.size*2.5,this.size,0,0,Math.PI*2);ctx.fill();}
    else{ctx.beginPath();ctx.arc(0,0,this.size*0.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
for(let i=0;i<40;i++) particles.push(new Particle());
function animateParticles() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ── ЗАПУСК ─────────────────────────────────────────────────────────────
applyLang();
loadContinents();
loadAllCountries();
checkShop();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkShop(); });
if (tg) {
  try { tg.setHeaderColor('#050d07'); } catch (e) {}
  try { if (tg.setBackgroundColor) tg.setBackgroundColor('#050d07'); } catch (e) {}
}
